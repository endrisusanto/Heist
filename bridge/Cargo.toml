[package]
name = "heist-bridge"
version = "0.1.0"
edition = "2021"
description = "Heist Bridge - System Tray Fleet Agent for Android Test Automation"

[dependencies]
tauri = { version = "2.1.1", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
futures-util = "0.3"
open = "5.1"
rfd = "0.14"
hostname = "0.4"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
