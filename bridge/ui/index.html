<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heist Bridge</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bridge-container">
    <div class="header">
      <div class="logo-box">
        <img src="logo.png" alt="Heist Logo" class="logo-img" />
      </div>
      <div class="title-box">
        <h1>Heist Bridge</h1>
        <p class="subtitle">System Tray Fleet Agent</p>
      </div>
    </div>

    <div class="status-card" id="statusCard">
      <div class="status-indicator" id="statusDot"></div>
      <div class="status-text">
        <strong id="statusTitle">Connecting...</strong>
        <span id="statusDetail">Initializing fleet bridge</span>
      </div>
    </div>

    <form id="configForm" class="config-form">
      <div class="form-row">
        <div class="form-group flex-1">
          <label for="nodeId">Node ID (PC Name)</label>
          <input type="text" id="nodeId" required placeholder="e.g. LAB-PC-01" />
        </div>
        <div class="form-group flex-2">
          <label for="hubUrl">Hub WebSocket URL</label>
          <input type="text" id="hubUrl" required placeholder="wss://heist.endrisusanto.my.id/ws/bridge" />
        </div>
      </div>

      <div class="form-group">
        <label for="atmRoot">ATM Root Directory</label>
        <div class="input-with-action">
          <input type="text" id="atmRoot" placeholder="/run/media/endri-pro/BINARY_HDD/AUTO or /home/.../ATM" />
          <button type="button" id="browseBtn" class="btn secondary">Browse</button>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn primary" id="saveBtn">Save & Reconnect</button>
        <button type="button" class="btn outline" id="hideBtn">Hide to Tray</button>
      </div>
    </form>

    <div class="terminal-card">
      <div class="terminal-header">
        <div class="terminal-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 17 10 11 4 5"></polyline>
            <line x1="12" y1="19" x2="20" y2="19"></line>
          </svg>
          <span>Terminal Logs</span>
        </div>
        <div class="terminal-actions">
          <button type="button" id="clearLogsBtn" class="btn-clear" title="Clear logs">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
            <span>Clear</span>
          </button>
        </div>
      </div>
      <div class="terminal-console" id="terminalLogs">
        <div class="log-entry sys">
          <span class="log-time">[Init]</span>
          <span class="log-msg">Heist Bridge agent UI initialized.</span>
        </div>
      </div>
    </div>

    <div class="footer">
      <span id="versionText">Heist Bridge v0.1.0</span>
      <span class="dot-sep">•</span>
      <span id="deviceCount">0 devices connected</span>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
